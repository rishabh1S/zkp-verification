services:
  parser-service:
    build:
      context: ./apps/parser-java
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    container_name: zkverify-parser
    env_file:
      - .env
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - TESSDATA_PATH=${TESSDATA_PATH}

  zk-prover:
    build:
      context: ./apps/zk-prover
      dockerfile: Dockerfile
    container_name: zkverify-zk-prover
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production

  orchestrator-service:
    build:
      context: .
      dockerfile: apps/orchestrator-python/Dockerfile
    ports:
      - "8000:8000"
    container_name: zkverify-orchestrator
    env_file:
      - .env
    environment:
      - PARSER_API_URL=${PARSER_API_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - ZK_PROVER_URL=${ZK_PROVER_URL}
      - DATABASE_URL=${DATABASE_URL}
      - WEB3_RPC_URL=${WEB3_RPC_URL}
      - VERIFIER_CONTRACT_ADDRESS=${VERIFIER_CONTRACT_ADDRESS}
      - VERIFIER_ABI_PATH=${VERIFIER_ABI_PATH}
    depends_on:
      - parser-service
      - zk-prover
