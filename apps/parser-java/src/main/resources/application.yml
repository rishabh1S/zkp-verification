spring:
  application:
    name: parser
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": true

server:
  port: 8080

tessdata:
  path: ${TESSDATA_PATH}

frontend:
  url: ${FRONTEND_URL}
